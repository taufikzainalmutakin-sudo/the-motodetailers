name: Fix brand hero styling

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-brand-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate brand title and match logo blue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="brand">THE MOTODETAILERS</div><div class="tag">Premium Motorcycle Care</div>'
          new = '<div class="tag">Premium Motorcycle Care</div>'
          s = s.replace(old, new)
          s = s.replace('.hero{background:linear-gradient(135deg,#0757d9,#0b67f0);', '.hero{background:#0757d9;')
          p.write_text(s, encoding='utf-8')
          PY
          if git diff --quiet -- index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix duplicate brand title and match logo blue [skip brand fix]'
          git push
