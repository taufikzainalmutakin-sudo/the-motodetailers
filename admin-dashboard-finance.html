<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE MOTODETAILERS Admin</title>
</head>
<body>
<div style="padding:20px;font-family:Arial,sans-serif;color:#111827">Memuat dashboard...</div>
<script>
(async()=>{
  try{
    const r=await fetch('./admin-dashboard-income.html?v=20260817-v3',{cache:'no-store'});
    if(!r.ok)throw new Error('Gagal memuat dashboard utama');
    const html=await r.text();
    document.open();
    document.write(html);
    document.close();
    const s=document.createElement('script');
    s.src='./admin-finance-base-loader-hotfix.js?v=20260817-v3';
    s.dataset.tmdFinanceBoot='1';
    document.head.appendChild(s);
  }catch(e){
    document.body.innerHTML='<div style="padding:24px;font-family:Arial,sans-serif;color:#991b1b">Gagal memuat dashboard: '+String(e.message||e).replace(/[<>]/g,'')+'</div>';
  }
})();
</script>
</body>
</html>
