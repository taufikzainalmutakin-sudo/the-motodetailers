<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0757d9">
<title>Admin — THE MOTODETAILERS</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7ff;color:#111827;min-height:100vh;display:flex;align-items:center;justify-content:center}.wrap{width:100%;padding:20px}.login{max-width:520px;margin:auto;background:#fff;padding:30px;border-radius:24px;box-shadow:0 12px 40px #00000012}.pill{display:inline-block;padding:7px 12px;border-radius:999px;background:#eaf1ff;color:#0757d9;font-weight:900;font-size:13px}.login h1{font-size:42px;line-height:1.05;margin:16px 0 10px}.muted{color:#6b7280;line-height:1.5}.status{padding:11px 13px;border-radius:11px;background:#eff6ff;color:#1d4ed8;font-size:14px;margin:18px 0}.status.error{background:#fef2f2;color:#b91c1c}.btn{width:100%;border:0;border-radius:12px;padding:14px;margin-top:18px;font-weight:900;font-size:16px;cursor:pointer;background:#0757d9;color:#fff}.btn.secondary{background:#6b7280}.btn:disabled{opacity:.65;cursor:wait}.input{width:100%;padding:14px;border:1px solid #dbe2ef;border-radius:12px;font:inherit;margin-top:7px}.field{margin-top:14px}.label{font-weight:800;font-size:14px}@media(max-width:600px){.wrap{padding:12px}.login{padding:24px 20px}.login h1{font-size:34px}}
</style>
</head>
<body>
<div class="wrap"><div class="login">
<span class="pill">ADMIN</span>
<h1>THE MOTODETAILERS</h1>
<p class="muted">Masuk ke dashboard admin untuk mengelola booking, layanan, harga, katalog motor dan pengaturan website.</p>
<div id="status" class="status">Masuk menggunakan email dan password admin.</div>
<div class="field"><div class="label">Email</div><input id="email" class="input" type="email" value="taufikzainalmutakin@gmail.com" autocomplete="username"></div>
<div class="field"><div class="label">Password</div><input id="password" class="input" type="password" autocomplete="current-password" placeholder="Masukkan password admin"></div>
<button id="login" class="btn" type="button">Sign In</button>
<button id="reset" class="btn secondary" type="button">Kirim Reset Password</button>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://nbsmkxarkpesjiftmbwm.supabase.co';
const SUPABASE_KEY='sb_publishable_dMXeVPXD_oU5NrdV2-sSew_CZxB5lFI';
const ADMIN_EMAIL='taufikzainalmutakin@gmail.com';
const DASHBOARD_URL='./admin-dashboard.html';
const RESET_URL='https://the-motodetailers-site.taufikzainalmutakin.workers.dev/admin-reset.html';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
function status(text,error=false){$('status').textContent=text;$('status').className='status'+(error?' error':'')}
async function syncServerSession(session){
  if(!session?.access_token||!session?.refresh_token)throw new Error('Sesi login tidak lengkap. Silakan login ulang.');
  const r=await fetch('/api/admin-session',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'X-Admin-Refresh-Token':session.refresh_token}});
  if(!r.ok)throw new Error('Sistem pengaman admin belum aktif. Tunggu deployment selesai lalu coba lagi.');
}
async function clearServerSession(){try{await fetch('/api/admin-session',{method:'DELETE',keepalive:true})}catch(_){} }
async function check(){
  const {data,error}=await db.auth.getSession();
  if(error||!data.session)return;
  const {data:userData,error:userError}=await db.auth.getUser();
  if(userError||!userData.user)return;
  const user=userData.user;
  if(user.email?.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await db.auth.signOut();status('Akun ini bukan akun admin.',true);return}
  const {data:profile}=await db.from('profiles').select('role').eq('id',user.id).maybeSingle();
  if(profile?.role!=='admin'){await db.auth.signOut();status('Akun belum memiliki role admin.',true);return}
  try{await syncServerSession(data.session);location.replace(DASHBOARD_URL)}catch(e){status(e.message,true)}
}
async function login(){
  const email=$('email').value.trim().toLowerCase();
  const password=$('password').value;
  if(!email||!password){status('Masukkan email dan password.',true);return}
  $('login').disabled=true;$('login').textContent='Signing in...';status('Memverifikasi akun...');
  const {data,error}=await db.auth.signInWithPassword({email,password});
  if(error){$('login').disabled=false;$('login').textContent='Sign In';status(error.message||'Login gagal.',true);return}
  if(data.user?.email?.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await db.auth.signOut();$('login').disabled=false;$('login').textContent='Sign In';status('Akun ini bukan akun admin.',true);return}
  const {data:profile, error:profileError}=await db.from('profiles').select('role').eq('id',data.user.id).maybeSingle();
  if(profileError||profile?.role!=='admin'){await db.auth.signOut();$('login').disabled=false;$('login').textContent='Sign In';status('Akun belum memiliki role admin.',true);return}
  try{await syncServerSession(data.session);location.replace(DASHBOARD_URL)}catch(e){await db.auth.signOut();$('login').disabled=false;$('login').textContent='Sign In';status(e.message,true)}
}
async function sendReset(){
  const email=$('email').value.trim().toLowerCase();
  if(email!==ADMIN_EMAIL){status('Gunakan email admin yang terdaftar.',true);return}
  $('reset').disabled=true;$('reset').textContent='Mengirim link reset...';status('Mengirim link reset password...');
  const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:RESET_URL});
  $('reset').disabled=false;$('reset').textContent='Kirim Reset Password';
  if(error){status(error.message,true);return}
  status('Link reset sudah dikirim. Cek Gmail terbaru.');
}
$('login').onclick=login;$('reset').onclick=sendReset;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
db.auth.onAuthStateChange((event,session)=>{if((event==='TOKEN_REFRESHED'||event==='SIGNED_IN')&&session)syncServerSession(session).catch(()=>{})});
check();
</script>
</body>
</html>
