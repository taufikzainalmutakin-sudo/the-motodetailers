<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0757d9"><title>Admin — THE MOTODETAILERS</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7ff;color:#111827;min-height:100vh;display:flex;align-items:center;justify-content:center}.wrap{width:100%;padding:20px}.login{max-width:520px;margin:auto;background:#fff;padding:30px;border-radius:24px;box-shadow:0 12px 40px #00000012}.pill{display:inline-block;padding:7px 12px;border-radius:999px;background:#eaf1ff;color:#0757d9;font-weight:900;font-size:13px}.login h1{font-size:42px;line-height:1.05;margin:16px 0 10px}.muted{color:#6b7280;line-height:1.5}.status{padding:11px 13px;border-radius:11px;background:#eff6ff;color:#1d4ed8;font-size:14px;margin:18px 0}.status.error{background:#fef2f2;color:#b91c1c}.btn{width:100%;border:0;border-radius:12px;padding:14px;margin-top:18px;font-weight:900;font-size:16px;cursor:pointer;background:#0757d9;color:#fff}.btn:disabled{opacity:.65;cursor:wait}.input{width:100%;padding:14px;border:1px solid #dbe2ef;border-radius:12px;font:inherit;margin-top:7px}.field{margin-top:14px}.label{font-weight:800;font-size:14px}@media(max-width:600px){.wrap{padding:12px}.login{padding:24px 20px}.login h1{font-size:34px}}</style></head><body><div class="wrap"><div class="login"><span class="pill">ADMIN</span><h1>THE MOTODETAILERS</h1><p class="muted">Masuk ke dashboard admin untuk mengelola booking, layanan, harga, katalog motor dan pengaturan website.</p><div id="status" class="status">Masuk menggunakan email dan password admin.</div><div class="field"><div class="label">Email</div><input id="email" class="input" type="email" value="taufikzainalmutakin@gmail.com" autocomplete="username"></div><div class="field"><div class="label">Password</div><input id="password" class="input" type="password" autocomplete="current-password" placeholder="Masukkan password admin"></div><button id="login" class="btn" type="button">Sign In</button></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://nbsmkxarkpesjiftmbwm.supabase.co';const SUPABASE_KEY='sb_publishable_dMXeVPXD_oU5NrdV2-sSew_CZxB5lFI';const DASHBOARD_URL='./admin-dashboard.html';const {createClient}=supabase;const db=createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);function status(t,e=false){$('status').textContent=t;$('status').className='status'+(e?' error':'')}async function check(){const {data:{user}}=await db.auth.getUser();if(!user)return;if(user.email!=='taufikzainalmutakin@gmail.com'){await db.auth.signOut();return status('Akun ini bukan akun admin.',true)}const {data:p}=await db.from('profiles').select('role').eq('id',user.id).maybeSingle();if(p?.role==='admin')location.replace(DASHBOARD_URL)}async function login(){const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(!email||!password)return status('Masukkan email dan password.',true);$('login').disabled=true;$('login').textContent='Signing in...';status('Memverifikasi akun...');const {data,error}=await db.auth.signInWithPassword({email,password});if(error){$('login').disabled=false;$('login').textContent='Sign In';return status(error.message||'Login gagal.',true)}if(data.user?.email!=='taufikzainalmutakin@gmail.com'){await db.auth.signOut();$('login').disabled=false;$('login').textContent='Sign In';return status('Akun ini bukan akun admin.',true)}const {data:p,error:pe}=await db.from('profiles').select('role').eq('id',data.user.id).maybeSingle();if(pe||p?.role!=='admin'){await db.auth.signOut();$('login').disabled=false;$('login').textContent='Sign In';return status('Akun belum memiliki role admin.',true)}location.replace(DASHBOARD_URL)}$('login').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});check();</script></body></html>
