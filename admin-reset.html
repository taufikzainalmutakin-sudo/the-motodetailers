<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — Admin</title><style>body{font-family:Arial,sans-serif;background:#f4f7ff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}.box{background:#fff;padding:28px;border-radius:20px;max-width:440px;width:calc(100% - 32px);box-shadow:0 10px 30px #0001}input,button{width:100%;padding:13px;margin-top:10px;border-radius:10px;font:inherit;box-sizing:border-box}input{border:1px solid #ddd}button{border:0;background:#0757d9;color:white;font-weight:700}.msg{margin:12px 0;color:#555}</style></head><body><div class="box"><h2>Reset Password Admin</h2><p class="msg" id="msg">Memeriksa link reset...</p><input id="p1" type="password" placeholder="Password baru"><input id="p2" type="password" placeholder="Ulangi password baru"><button id="save">Simpan Password</button></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const {createClient}=supabase;const db=createClient('https://nbsmkxarkpesjiftmbwm.supabase.co','sb_publishable_dMXeVPXD_oU5NrdV2-sSew_CZxB5lFI');const msg=document.getElementById('msg');async function init(){const {data:{session}}=await db.auth.getSession();if(!session){msg.textContent='Link reset tidak valid atau sudah kedaluwarsa. Kirim reset password lagi.';document.getElementById('save').disabled=true;return}msg.textContent='Link valid. Masukkan password baru.'}document.getElementById('save').onclick=async()=>{const a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(a.length<6)return msg.textContent='Password minimal 6 karakter.';if(a!==b)return msg.textContent='Password tidak sama.';const {error}=await db.auth.updateUser({password:a});if(error)return msg.textContent=error.message;msg.textContent='Password berhasil diubah. Mengarahkan ke admin...';setTimeout(()=>location.href='/admin.html',800)};init();</script></body></html>
