<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — Admin</title><style>body{font-family:Arial,sans-serif;background:#f4f7ff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}.box{background:#fff;padding:28px;border-radius:20px;max-width:440px;width:calc(100% - 32px);box-shadow:0 10px 30px #0001}input,button{width:100%;padding:13px;margin-top:10px;border-radius:10px;font:inherit;box-sizing:border-box}input{border:1px solid #ddd}button{border:0;background:#0757d9;color:white;font-weight:700}.msg{margin:12px 0;color:#555}</style></head><body><div class="box"><h2>Reset Password Admin</h2><p class="msg" id="msg">Memproses link reset...</p><input id="p1" type="password" placeholder="Password baru" disabled><input id="p2" type="password" placeholder="Ulangi password baru" disabled><button id="save" disabled>Simpan Password</button></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const {createClient}=supabase;const db=createClient('https://nbsmkxarkpesjiftmbwm.supabase.co','sb_publishable_dMXeVPXD_oU5NrdV2-sSew_CZxB5lFI',{auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});const msg=document.getElementById('msg'),p1=document.getElementById('p1'),p2=document.getElementById('p2'),save=document.getElementById('save');let ready=false;function enable(){ready=true;p1.disabled=false;p2.disabled=false;save.disabled=false;msg.textContent='Link valid. Masukkan password baru.'}async function init(){const hash=location.hash;const query=new URLSearchParams(location.search);if(query.get('code')){const {error}=await db.auth.exchangeCodeForSession(query.get('code'));if(error){msg.textContent='Link reset tidak valid atau sudah kedaluwarsa. Kirim reset password lagi.';return}}const {data:{session}}=await db.auth.getSession();if(session){enable();return}setTimeout(async()=>{const {data:{session}}=await db.auth.getSession();if(session)enable();else msg.textContent='Link reset tidak valid atau sudah kedaluwarsa. Kirim reset password lagi.'},1500)}db.auth.onAuthStateChange((event,session)=>{if(session&&(event==='PASSWORD_RECOVERY'||event==='SIGNED_IN'||event==='INITIAL_SESSION'))enable()});save.onclick=async()=>{const a=p1.value,b=p2.value;if(a.length<6)return msg.textContent='Password minimal 6 karakter.';if(a!==b)return msg.textContent='Password tidak sama.';save.disabled=true;const {error}=await db.auth.updateUser({password:a});if(error){save.disabled=false;return msg.textContent=error.message}msg.textContent='Password berhasil diubah. Mengarahkan ke admin...';setTimeout(()=>location.href='/admin.html',800)};init();</script></body></html>
