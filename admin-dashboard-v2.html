<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0757d9"><title>Admin Dashboard — THE MOTODETAILERS</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7ff;color:#111827}.hidden{display:none!important}.top{background:#0757d9;color:#fff;padding:18px 14px;position:sticky;top:0;z-index:5}.topin,.wrap{max-width:1100px;margin:auto}.topin{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-weight:900}.muted{color:#6b7280;font-size:13px}.top .muted{color:#dbeafe}.wrap{padding:18px 12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:15px}.card,.panel{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:16px;box-shadow:0 4px 15px #00000008}.card b{font-size:25px;color:#0757d9}.tabs{display:flex;gap:8px;overflow:auto;padding:6px 0 14px}.tab{border:1px solid #dbe2ef;background:#fff;border-radius:999px;padding:10px 14px;font-weight:800;white-space:nowrap}.tab.active{background:#0757d9;color:#fff}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;background:#0757d9;color:#fff}.btn.gray{background:#e5e7eb;color:#111827}.btn.danger{background:#dc2626}.input,select,textarea{width:100%;padding:12px;border:1px solid #dbe2ef;border-radius:10px;font:inherit;margin:6px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#eaf1ff;color:#0757d9;font-size:12px;font-weight:800}.toast{position:fixed;right:15px;bottom:15px;background:#111827;color:#fff;padding:12px 15px;border-radius:12px;z-index:20}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:10px 8px;border-bottom:1px solid #edf0f5;text-align:left}.price-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.editor{margin-top:14px}.switch{display:flex;align-items:center;gap:8px}.switch input{width:auto}@media(max-width:760px){.cards,.grid,.price-grid{grid-template-columns:1fr 1fr}.wrap{padding:14px 9px}}@media(max-width:520px){.cards,.grid,.price-grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="topin"><div><div class="logo">THE MOTODETAILERS — ADMIN</div><div id="userInfo" class="muted">Memuat...</div></div><button id="logout" class="btn gray">Keluar</button></div></header><main class="wrap"><div class="cards"><div class="card">Booking pending<br><b id="pending">0</b></div><div class="card">Booking hari ini<br><b id="today">0</b></div><div class="card">Layanan aktif<br><b id="serviceCount">0</b></div><div class="card">Motor aktif<br><b id="motorCount">0</b></div></div><nav class="tabs"><button class="tab active" data-tab="bookings">Booking</button><button class="tab" data-tab="services">Layanan</button><button class="tab" data-tab="prices">Pricelist</button><button class="tab" data-tab="motors">Katalog Motor</button><button class="tab" data-tab="settings">Pengaturan</button></nav><section id="bookings" class="tabpage"><div class="panel"><div class="panelhead"><h2>Booking</h2><button id="refreshBookings" class="btn gray">Refresh</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Customer</th><th>Motor</th><th>Jadwal</th><th>Status</th></tr></thead><tbody id="bookingRows"></tbody></table></div></div></section><section id="services" class="tabpage hidden"><div class="panel"><div class="panelhead"><h2>Layanan</h2><button id="addService" class="btn">+ Layanan</button></div><div id="serviceList"></div><div id="serviceEditor" class="panel editor hidden"><h3 id="serviceTitle">Tambah layanan</h3><input type="hidden" id="serviceId"><label>Nama</label><input id="serviceName" class="input"><label>Slug</label><input id="serviceSlug" class="input"><label>Deskripsi</label><textarea id="serviceDesc" class="input" rows="3"></textarea><label>Link hasil/Instagram</label><input id="serviceUrl" class="input"><label>URL gambar</label><input id="serviceImage" class="input"><label>Urutan</label><input id="serviceSort" class="input" type="number" value="0"><label class="switch"><input id="serviceActive" type="checkbox" checked> Aktif</label><div class="actions"><button id="saveService" class="btn">Simpan</button><button id="cancelService" class="btn gray">Batal</button></div></div></div></section><section id="prices" class="tabpage hidden"><div class="panel"><div class="panelhead"><h2>Pricelist</h2><button id="refreshPrices" class="btn gray">Refresh</button></div><div id="priceList" class="price-grid"></div></div></section><section id="motors" class="tabpage hidden"><div class="panel"><div class="panelhead"><h2>Katalog Motor</h2><button id="addMotor" class="btn">+ Motor</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Brand</th><th>Model</th><th>Size</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="motorRows"></tbody></table></div><div id="motorEditor" class="panel editor hidden"><h3 id="motorTitle">Tambah motor</h3><input type="hidden" id="motorId"><div class="grid"><div><label>Brand</label><input id="motorBrand" class="input"></div><div><label>Model</label><input id="motorModel" class="input"></div><div><label>Size</label><select id="motorSize" class="input"></select></div><div><label>Urutan</label><input id="motorSort" class="input" type="number" value="0"></div></div><label class="switch"><input id="motorActive" type="checkbox" checked> Aktif</label><div class="actions"><button id="saveMotor" class="btn">Simpan</button><button id="cancelMotor" class="btn gray">Batal</button></div></div></div></section><section id="settings" class="tabpage hidden"><div class="panel"><div class="panelhead"><h2>Pengaturan website</h2><button id="saveSettings" class="btn">Simpan</button></div><div class="grid"><div><label>WhatsApp</label><input id="wa" class="input"></div><div><label>Instagram</label><input id="ig" class="input"></div><div><label>TikTok</label><input id="tt" class="input"></div><div><label>Google Maps</label><input id="maps" class="input"></div></div><label>Pesan booking</label><textarea id="bookingMsg" class="input" rows="6"></textarea></div></section></main><div id="toast" class="toast hidden"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://nbsmkxarkpesjiftmbwm.supabase.co',KEY='sb_publishable_dMXeVPXD_oU5NrdV2-sSew_CZxB5lFI',ADMIN='taufikzainalmutakin@gmail.com';const db=supabase.createClient(URL,KEY),$=id=>document.getElementById(id);let services=[],sizes=[],motors=[],prices=[];const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),toast=t=>{const x=$('toast');x.textContent=t;x.classList.remove('hidden');clearTimeout(window._tt);window._tt=setTimeout(()=>x.classList.add('hidden'),2800)};function show(tab){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));document.querySelectorAll('.tabpage').forEach(x=>x.classList.toggle('hidden',x.id!==tab))}document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>show(x.dataset.tab));$('logout').onclick=()=>db.auth.signOut().then(()=>location.href='./admin.html');async function adminGuard(){const {data:{user}}=await db.auth.getUser();if(!user||user.email?.toLowerCase()!==ADMIN.toLowerCase()){location.href='./admin.html';return false}const {data:p}=await db.from('profiles').select('full_name,role').eq('id',user.id).maybeSingle();if(p?.role!=='admin'){await db.auth.signOut();location.href='./admin.html';return false}$('userInfo').textContent=p.full_name||user.email;return true}async function loadServices(){const {data,error}=await db.from('services').select('*').order('sort_order');if(error){toast(error.message);return}services=data||[];$('serviceCount').textContent=services.filter(x=>x.active).length;$('serviceList').innerHTML=services.map(s=>`<div class="card" style="margin:9px 0"><div class="panelhead"><div><b>${esc(s.name)}</b><div class="muted">${esc(s.description||'')}</div></div><span class="pill">${s.active?'Aktif':'Nonaktif'}</span></div><div class="actions" style="margin-top:10px"><button class="btn" data-act="edit" data-id="${s.id}">Edit</button><button class="btn gray" data-act="toggle" data-id="${s.id}">${s.active?'Nonaktifkan':'Aktifkan'}</button><button class="btn danger" data-act="delete" data-id="${s.id}">Hapus</button></div></div>`).join('')||'<div class="muted">Belum ada layanan.</div>'}function openService(id=''){const s=id?services.find(x=>x.id===id):null;$('serviceId').value=s?.id||'';$('serviceTitle').textContent=s?'Edit layanan':'Tambah layanan';$('serviceName').value=s?.name||'';$('serviceSlug').value=s?.slug||'';$('serviceDesc').value=s?.description||'';$('serviceUrl').value=s?.result_url||'';$('serviceImage').value=s?.image_url||'';$('serviceSort').value=s?.sort_order??0;$('serviceActive').checked=s?.active!==false;$('serviceEditor').classList.remove('hidden');$('serviceEditor').scrollIntoView({behavior:'smooth',block:'start'})}async function saveService(){const id=$('serviceId').value,name=$('serviceName').value.trim(),slug=$('serviceSlug').value.trim();if(!name||!slug){toast('Nama dan slug wajib diisi');return}const row={name,slug,description:$('serviceDesc').value.trim()||null,result_url:$('serviceUrl').value.trim()||null,image_url:$('serviceImage').value.trim()||null,sort_order:Number($('serviceSort').value)||0,active:$('serviceActive').checked};const q=id?db.from('services').update(row).eq('id',id):db.from('services').insert(row);const {error}=await q;if(error){toast('Gagal menyimpan: '+error.message);return}toast(id?'Layanan diubah':'Layanan ditambahkan');$('serviceEditor').classList.add('hidden');await loadServices();await loadPrices()}async function toggleService(id){const s=services.find(x=>x.id===id);if(!s)return;const {error}=await db.from('services').update({active:!s.active}).eq('id',id);if(error){toast('Gagal mengubah status: '+error.message);return}toast(s.active?'Layanan dinonaktifkan':'Layanan diaktifkan');await loadServices();await loadPrices()}async function deleteService(id){const s=services.find(x=>x.id===id);if(!s)return;if(!confirm('Hapus layanan '+s.name+'?'))return;const {error}=await db.from('services').delete().eq('id',id);if(error){toast('Gagal menghapus: '+error.message);return}toast('Layanan dihapus');$('serviceEditor').classList.add('hidden');await loadServices();await loadPrices()}$('addService').onclick=()=>openService();$('saveService').onclick=saveService;$('cancelService').onclick=()=>$('serviceEditor').classList.add('hidden');$('serviceList').onclick=e=>{const b=e.target.closest('[data-act]');if(!b)return;const id=b.dataset.id;b.dataset.act==='edit'&&openService(id);b.dataset.act==='toggle'&&toggleService(id);b.dataset.act==='delete'&&deleteService(id)};async function loadSizes(){const {data}=await db.from('motor_sizes').select('*').order('sort_order');sizes=data||[];$('motorSize').innerHTML=sizes.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}async function loadMotors(){const {data,error}=await db.from('motor_catalog').select('*,motor_sizes(name)').order('brand').order('sort_order').limit(5000);if(error){toast(error.message);return}motors=data||[];$('motorCount').textContent=motors.filter(x=>x.active).length;$('motorRows').innerHTML=motors.map(m=>`<tr><td>${esc(m.brand)}</td><td>${esc(m.model)}</td><td>${esc(m.motor_sizes?.name||'-')}</td><td><span class="pill">${m.active?'Aktif':'Nonaktif'}</span></td><td><div class="actions"><button class="btn" data-mact="edit" data-id="${m.id}">Edit</button><button class="btn gray" data-mact="toggle" data-id="${m.id}">${m.active?'Nonaktifkan':'Aktifkan'}</button><button class="btn danger" data-mact="delete" data-id="${m.id}">Hapus</button></div></td></tr>`).join('')||'<tr><td colspan="5">Belum ada motor.</td></tr>'}function openMotor(id=''){const m=id?motors.find(x=>x.id===id):null;$('motorId').value=m?.id||'';$('motorTitle').textContent=m?'Edit motor':'Tambah motor';$('motorBrand').value=m?.brand||'';$('motorModel').value=m?.model||'';$('motorSize').value=m?.motor_size_id||sizes[0]?.id||'';$('motorSort').value=m?.sort_order??0;$('motorActive').checked=m?.active!==false;$('motorEditor').classList.remove('hidden');$('motorEditor').scrollIntoView({behavior:'smooth',block:'start'})}async function saveMotor(){const id=$('motorId').value,row={brand:$('motorBrand').value.trim(),model:$('motorModel').value.trim(),motor_size_id:$('motorSize').value||null,sort_order:Number($('motorSort').value)||0,active:$('motorActive').checked};if(!row.brand||!row.model){toast('Brand dan model wajib diisi');return}const q=id?db.from('motor_catalog').update(row).eq('id',id):db.from('motor_catalog').insert(row);const {error}=await q;if(error){toast('Gagal menyimpan motor: '+error.message);return}toast('Motor tersimpan');$('motorEditor').classList.add('hidden');loadMotors()}async function toggleMotor(id){const m=motors.find(x=>x.id===id);if(!m)return;const {error}=await db.from('motor_catalog').update({active:!m.active}).eq('id',id);if(error)toast(error.message);else{toast('Status motor diperbarui');loadMotors()}}async function deleteMotor(id){if(!confirm('Hapus motor?'))return;const {error}=await db.from('motor_catalog').delete().eq('id',id);if(error)toast(error.message);else{toast('Motor dihapus');loadMotors()}}$('addMotor').onclick=()=>openMotor();$('saveMotor').onclick=saveMotor;$('cancelMotor').onclick=()=>$('motorEditor').classList.add('hidden');$('motorRows').onclick=e=>{const b=e.target.closest('[data-mact]');if(!b)return;const id=b.dataset.id;b.dataset.mact==='edit'&&openMotor(id);b.dataset.mact==='toggle'&&toggleMotor(id);b.dataset.mact==='delete'&&deleteMotor(id)};async function loadPrices(){const {data,error}=await db.from('service_prices').select('*,services(name),motor_sizes(name)').order('motor_size_id');if(error){toast(error.message);return}prices=data||[];$('priceList').innerHTML=prices.map(p=>`<div class="card"><b>${esc(p.services?.name||'Layanan')}</b><div class="muted">${esc(p.motor_sizes?.name||'Size')}</div><strong>${money(p.price)}</strong></div>`).join('')||'<div class="muted">Belum ada harga.</div>'}async function loadBookings(){const {data,error}=await db.from('bookings').select('*').order('appointment_date').order('appointment_time');if(error){toast(error.message);return}const t=new Date().toISOString().slice(0,10);$('pending').textContent=(data||[]).filter(x=>x.status==='pending').length;$('today').textContent=(data||[]).filter(x=>x.appointment_date===t).length;$('bookingRows').innerHTML=(data||[]).map(b=>`<tr><td><b>${esc(b.customer_name)}</b><br>${esc(b.phone||'')}</td><td>${esc(b.motor_type||'-')}</td><td>${b.appointment_date||'-'} ${b.appointment_time?(b.appointment_time+'').slice(0,5):''}</td><td><span class="pill">${esc(b.status)}</span></td></tr>`).join('')||'<tr><td colspan="4">Belum ada booking.</td></tr>'}async function loadSettings(){const {data}=await db.from('site_settings').select('setting_key,setting_value');const x=Object.fromEntries((data||[]).map(r=>[r.setting_key,r.setting_value]));$('wa').value=x.whatsapp?.url||'';$('ig').value=x.instagram?.url||'';$('tt').value=x.tiktok?.url||'';$('maps').value=x.google_maps?.url||'';$('bookingMsg').value=x.booking_message?.text||''}async function saveSettings(){const vals={whatsapp:{url:$('wa').value.trim()},instagram:{url:$('ig').value.trim()},tiktok:{url:$('tt').value.trim()},google_maps:{url:$('maps').value.trim()},booking_message:{text:$('bookingMsg').value}};for(const [setting_key,setting_value] of Object.entries(vals)){const {error}=await db.from('site_settings').upsert({setting_key,setting_value},{onConflict:'setting_key'});if(error){toast(error.message);return}}toast('Pengaturan tersimpan')}$('refreshBookings').onclick=loadBookings;$('refreshPrices').onclick=loadPrices;$('saveSettings').onclick=saveSettings;(async()=>{if(!(await adminGuard()))return;await Promise.all([loadServices(),loadSizes(),loadMotors(),loadPrices(),loadBookings(),loadSettings()])})();</script></body></html>
