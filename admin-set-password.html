<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0757d9"><title>Menyiapkan Password Admin — THE MOTODETAILERS</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7ff;color:#111827;min-height:100vh;display:flex;align-items:center;justify-content:center}.box{width:min(520px,calc(100% - 24px));background:#fff;border-radius:24px;padding:30px;box-shadow:0 12px 40px #00000012}.pill{display:inline-block;padding:7px 12px;border-radius:999px;background:#eaf1ff;color:#0757d9;font-weight:900;font-size:13px}h1{font-size:32px;margin:16px 0 10px}.status{padding:12px 14px;border-radius:12px;background:#eff6ff;color:#1d4ed8;line-height:1.5}.status.error{background:#fef2f2;color:#b91c1c}.muted{color:#6b7280;line-height:1.5}.btn{display:block;text-decoration:none;text-align:center;border:0;border-radius:12px;padding:14px;margin-top:18px;font-weight:900;font-size:16px;background:#0757d9;color:#fff}
</style>
</head>
<body><div class="box">
<span class="pill">ADMIN</span><h1>Menyiapkan Password</h1>
<div id="status" class="status">Memverifikasi link recovery...</div>
<p class="muted">Halaman ini hanya bisa mengatur password setelah link reset dari email admin berhasil diverifikasi.</p>
<a id="back" class="btn" href="./admin.html" style="display:none">Kembali ke Login Admin</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://nbsmkxarkpesjiftmbwm.supabase.co';
const SUPABASE_KEY='sb_publishable_dMXeVPXD_oU5NrdV2-sSew_CZxB5lFI';
const ADMIN_EMAIL='taufikzainalmutakin@gmail.com';
const ADMIN_PASSWORD='MotoAdmin#26!TMD';
const DASHBOARD_URL='./admin-dashboard.html';
const {createClient}=supabase;const db=createClient(SUPABASE_URL,SUPABASE_KEY);
const status=document.getElementById('status');const back=document.getElementById('back');
function fail(t){status.textContent=t;status.className='status error';back.style.display='block'}
async function finish(){
  const {data:{user}}=await db.auth.getUser();
  if(!user)return fail('Sesi recovery tidak ditemukan. Buka link reset password terbaru dari email admin.');
  if((user.email||'').toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await db.auth.signOut();return fail('Email recovery bukan email admin.')}
  status.textContent='Password admin sedang disiapkan...';
  const {error}=await db.auth.updateUser({password:ADMIN_PASSWORD});
  if(error)return fail(error.message||'Password gagal disiapkan.');
  status.textContent='Berhasil. Password admin sudah dibuat. Membuka dashboard...';
  setTimeout(()=>location.replace(DASHBOARD_URL),700);
}
db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'||event==='SIGNED_IN')finish()});
setTimeout(finish,1200);
</script>
</body></html>
